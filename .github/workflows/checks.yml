name: Checks

# Reusable workflow: the one definition of "did the suite pass" that both
# `CI` (on every push/PR) and `Release` (on every tag push) call, so the
# release gate cannot drift from what CI actually runs.
#
# `env` set on a *caller* workflow does not propagate into a workflow
# invoked via `workflow_call`, so RUST_VERSION is pinned here rather than
# inherited from CI's or Release's own `env:` block.
on:
  workflow_call:

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

# Reusable-workflow permissions can only be *downgraded* by the caller, not
# raised, so this is the ceiling: read-only. Release's caller job explicitly
# sets the same read-only permissions rather than inheriting its own
# `contents: write` / `packages: write`.
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
    # Full history and tags: `build.rs` bakes `git describe` into GIT_DESCRIBE,
    # and the upgrade tests parse it as a semver. A shallow, tagless checkout
    # makes `git describe` fall back to a bare commit id, so the tests read
    # `4263b4d` as a version, take `4263` as the major, and die on the `b`.
    # release-and-publish.yml already fetches tags; this workflow did not, which
    # is why it failed on a runner and passed on every developer machine.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"

    - name: Install otto (dogfood - this repo's own checks run through otto)
      run: cargo install --path . --locked

    # `otto quick` runs compile + clippy + fmt-check + test + docs-check as
    # independent siblings (`.otto.yml`), so one failing check does not hide the others
    # and the invocation can never drift from what a contributor runs
    # locally. `otto ci` also includes `lint`, which shells out to a
    # personal `whitespace` binary with no published release; that has no
    # CI-portable install path, so it stays a local-only check and is not
    # run here (unchanged from the CI behavior this replaces, which never
    # ran it either).
    - name: Run otto quick (compile + clippy + fmt-check + test + doc links)
      run: otto quick

  bash32:
    # otto spawns `bash <script>`, so the interpreter for every `bash:` task is
    # whatever `bash` PATH resolves to. On macOS that is /bin/bash 3.2.57, which
    # Apple froze at the last GPLv2 release and will never update. Two bugs
    # shipped in v2.0.0-v2.0.3 because the suite only ever ran under a bash 5:
    # a bash-4-only case fold aborted every task with a dependency, and the
    # single-quote escape in the output writer produced a different string under
    # 3.2, silently corrupting any value containing an apostrophe.
    #
    # This runs the real suite with `bash` pinned to the 3.2 that ships in the
    # image, which is the interpreter our macOS users actually get.
    #
    # It lives HERE, not in ci.yml, so the release gate sees it: v2.0.5
    # published from a SHA whose bash32 run was red, because this job sat in
    # ci.yml while Release gates only on this reusable workflow. This file's
    # header says it is the one definition of "did the suite pass"; that is
    # only true while every suite-running job is in it.
    name: Suite under macOS /bin/bash 3.2
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: macos-14

    # The image may carry a Homebrew bash ahead of /bin on PATH, which would
    # make this job a duplicate of the Linux run. Pin it explicitly.
    - name: Pin `bash` to /bin/bash 3.2
      run: |
        set -euo pipefail
        version_line=$(/bin/bash --version | head -1)
        echo "$version_line"
        case "$version_line" in
          *"version 3."*) ;;
          *)
            echo "::error::/bin/bash is no longer 3.x; needs rewriting"
            exit 1
            ;;
        esac
        mkdir -p "$RUNNER_TEMP/bash32"
        ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
        echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

    - name: Confirm the pin took
      run: bash --version | head -1

    # `--no-fail-fast`: cargo stops after the first failing test binary, so a
    # platform difference in one target hides every other one behind it. This
    # job exists to find them, so it runs them all.
    - name: Test
      run: cargo test --locked --no-fail-fast

  # The coverage floor, on the runner. `otto ci` is what chains `cov` locally,
  # but `ci` also pulls in `lint`, which shells out to a personal `whitespace`
  # binary with no published release and therefore no CI-portable install path
  # (see the note on `otto quick` above). Running `cov` directly gets the gate
  # without the unusable dependency: `cov` instruments and runs the suite, its
  # own `after: [cov-report]` chains the threshold check, and `cov-report`
  # exits 1 when line coverage is under `cov-report`'s `--fail-under` default
  # (`.otto.yml`; see that task's own comment for the current number, rather
  # than duplicating a value here that will drift again). This job is what
  # makes the floor real: before
  # it existed, the committed floor only ever ran on a developer's machine.
  #
  # Its own job rather than a step in `checks` so a coverage failure and a
  # test/clippy/fmt failure are reported independently, the same reason
  # `otto quick` runs its checks as siblings.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    # Full history and tags: `build.rs` bakes `git describe` into GIT_DESCRIBE,
    # and the upgrade tests parse it as a semver. A shallow, tagless checkout
    # makes `git describe` fall back to a bare commit id, so the tests read
    # `4263b4d` as a version, take `4263` as the major, and die on the `b`.
    # release-and-publish.yml already fetches tags; this workflow did not, which
    # is why it failed on a runner and passed on every developer machine.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: llvm-tools-preview

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: coverage

    # Pinned, like RUST_VERSION: the coverage floor is only "cannot change
    # silently" if the tool that computes the numerator and denominator is
    # fixed too. cargo-llvm-cov 0.9.0 excludes *_tests.rs files from the
    # denominator where 0.6.x counted them, a ~4.5-point swing with no diff
    # in this repo; an unpinned @latest re-opens exactly that.
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov@0.9.0

    - name: Install otto (dogfood - this repo's own checks run through otto)
      run: cargo install --path . --locked

    - name: Run otto cov (instrumented suite + the committed coverage floor)
      run: otto cov
