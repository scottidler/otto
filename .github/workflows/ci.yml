name: CI

on:
  push:
    branches: [main, makefile]
  pull_request:

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  checks:
    # Shared with `Release` (`checks.yml`), so a red suite can never be
    # published: neither workflow defines its own idea of "passing".
    uses: ./.github/workflows/checks.yml

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-14  # Apple Silicon ARM
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: ${{ matrix.os }}

    - name: Build
      run: cargo build --release --verbose
