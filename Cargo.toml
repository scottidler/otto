[package]
name = "otto"
version = "2.1.0"
edition = "2024"
authors = ["Scott Idler <scott.a.idler@gmail.com>"]
build = "build.rs"

[lib]
name = "otto"
path = "src/lib.rs"

[[bin]]
name = "otto"
path = "src/main.rs"

[features]
default = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal", "io-util", "process"] }
levenshtein = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
log = { version = "0.4", features = ["std", "serde"] }
env_logger = "0.11"
dirs = "6.0"
expanduser = "1.2.2"
eyre = "0.6.14"
num_cpus = "1.17.0"
daggy = "0.9.0"
sha2 = "0.11.0"
hex = "0.4.3"
glob = "0.3"
tempfile = "3.27"
regex = "1.13.1"
colored = "3.1.1"
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
console = "0.16"
comfy-table = "8.0"
hostname = "0.4"
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1.1"
semver = "1.0"
indicatif = "0.18"
async-trait = "0.1.92"
indexmap = { version = "2.14.1", features = ["serde"] }
libc = "0.2.189"

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.1"
filetime = "0.2"
assert_cmd = "2.2"
serial_test = "4.0"
tempfile = "3.27"

[build-dependencies]
