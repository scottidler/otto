# Only two settings actually override rustfmt's defaults; the rest of this
# file used to be a 2017 rustfmt config template listing every option that
# existed then, commented out, most of which no longer exist in current
# rustfmt (nightly-only or removed options). `cargo fmt --all --check` staying
# clean with just these two lines is the proof the deleted lines were inert.

# Default: 100
max_width = 120

# Default: 50
single_line_if_else_max_width = 80
