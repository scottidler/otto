otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
    GIT_SHA: "$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"

tasks:
  # Whitespace linting
  lint:
    help: "Run whitespace linting"
    bash: |
      whitespace -r

  # Code quality checks — split into leaf tasks so they parallelize and
  # so fmt-check can auto-fix on failure via the on-failure: sugar.
  compile:
    help: "Verify the workspace compiles (cargo check)"
    bash: |
      cargo check --workspace --all-targets --all-features

  clippy:
    help: "Run clippy with warnings as errors"
    bash: |
      cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt-check:
    help: "Verify formatting; auto-runs fmt-fix on failure"
    bash: |
      cargo fmt --all --check
    on-failure:
      - fmt-fix

  fmt-fix:
    help: "Apply cargo fmt to fix format drift"
    bash: |
      cargo fmt --all

  # Meta-task aggregating the three leaves above. Preserves `otto check`
  # for callers that already know the name.
  check:
    help: "Run all quality checks (compile + clippy + fmt-check)"
    before: [compile, clippy, fmt-check]
    bash: |
      echo "✅ All checks passed!"

  # Run tests
  test:
    help: "Run all tests"
    bash: |
      cargo test --workspace --all-features

  # Run coverage tests and output data
  cov:
    help: "Run tests with coverage via llvm-cov"
    after: [cov-report]
    bash: |
      echo "Running tests with coverage..."

      JSON_FILE="$OTTO_TASK_DIR/coverage.json"

      # Run coverage
      TEST_FAILED=0
      if ! cargo llvm-cov --workspace --all-features --json --output-path "$JSON_FILE" 2>&1; then
        TEST_FAILED=1
      fi

      # Validate JSON was created
      if [ ! -s "$JSON_FILE" ] || ! jq -e '.data[0].totals' "$JSON_FILE" >/dev/null 2>&1; then
        echo "Tests failed - no coverage data generated"
        exit 1
      fi

      # Generate HTML report
      cargo llvm-cov report --html --output-dir target/llvm-cov/html >/dev/null 2>&1 || true

      # Output data for cov-report
      otto_set_output "json_path" "$JSON_FILE"
      otto_set_output "test_failed" "$TEST_FAILED"
      otto_set_output "lines_pct" "$(jq -r '.data[0].totals.lines.percent // 0' "$JSON_FILE")"
      otto_set_output "lines_cov" "$(jq -r '.data[0].totals.lines.covered // 0' "$JSON_FILE")"
      otto_set_output "lines_tot" "$(jq -r '.data[0].totals.lines.count // 0' "$JSON_FILE")"
      otto_set_output "funcs_pct" "$(jq -r '.data[0].totals.functions.percent // 0' "$JSON_FILE")"
      otto_set_output "funcs_cov" "$(jq -r '.data[0].totals.functions.covered // 0' "$JSON_FILE")"
      otto_set_output "funcs_tot" "$(jq -r '.data[0].totals.functions.count // 0' "$JSON_FILE")"
      otto_set_output "regions_pct" "$(jq -r '.data[0].totals.regions.percent // 0' "$JSON_FILE")"

  # Display coverage report (runs after cov)
  cov-report:
    help: "Display coverage report"
    params:
      --fail-under:
        # Floor, not a target. Runner truth (2026-09-01, audit batch 12):
        # 87.4% line coverage (12517/14317 lines, CI run 33433873821), so
        # the margin over this floor is 0.4 points. That tightness is the
        # point: at 85 the floor was decorative, and a floor that cannot
        # trip is not an alarm. Losing ~57 covered lines rings it.
        # Local numbers read ~4.5 points higher because local
        # cargo-llvm-cov 0.6.x counts *_tests.rs files in the denominator
        # while the runner's pinned 0.9.0 excludes them; trust the runner's
        # number, not a local one, and never ratchet off a local pass.
        # A literal committed value, per the design doc's mechanism, so
        # raising it is a reviewable diff and lowering it cannot happen
        # silently. Enforced on CI by the `coverage` job in
        # `.github/workflows/checks.yml`, which runs `otto cov` (this task
        # is chained by `cov`'s own `after:`). Ratcheting up is the owner's
        # call, and only on a runner measurement.
        default: "87"
        help: "Minimum line coverage percentage (0 = no threshold)"
      --json:
        default: "false"
        help: "Output raw JSON coverage data"
      --details:
        default: "false"
        help: "Show detailed per-file coverage"
    bash: |
      # Colors provided by otto builtins: RED, GREEN, YELLOW, BLUE, CYAN, MAGENTA, BOLD, DIM, NC

      color_pct() {
        local pct=$1
        local int_pct=${pct%.*}
        if [ "$int_pct" -ge 80 ]; then echo -e "${GREEN}${pct}%${NC}"
        elif [ "$int_pct" -ge 60 ]; then echo -e "${YELLOW}${pct}%${NC}"
        else echo -e "${RED}${pct}%${NC}"; fi
      }

      # Get data from cov task
      JSON_PATH=$(otto_get_input "cov.json_path")
      TEST_FAILED=$(otto_get_input "cov.test_failed")
      LINES_PCT=$(printf "%.1f" "$(otto_get_input "cov.lines_pct")")
      LINES_COV=$(otto_get_input "cov.lines_cov")
      LINES_TOT=$(otto_get_input "cov.lines_tot")
      FUNCS_PCT=$(printf "%.1f" "$(otto_get_input "cov.funcs_pct")")
      FUNCS_COV=$(otto_get_input "cov.funcs_cov")
      FUNCS_TOT=$(otto_get_input "cov.funcs_tot")
      REGIONS_PCT=$(printf "%.1f" "$(otto_get_input "cov.regions_pct")")

      # Raw JSON mode
      if [ "${json}" = "true" ]; then
        cat "$JSON_PATH"
        exit $TEST_FAILED
      fi

      # Detailed per-file coverage
      if [ "${details}" = "true" ]; then
        echo -e "${BOLD}${CYAN}Per-file Coverage:${NC}"
        echo -e "${DIM}────────────────────────────────────────────────────────${NC}"
        jq -r '.data[0].files[] | "\(.filename)|\(.summary.lines.percent // 0)|\(.summary.lines.covered // 0)|\(.summary.lines.count // 0)"' "$JSON_PATH" | \
        sort -t'|' -k2 -n | while IFS='|' read -r file pct covered total; do
          display=$(echo "$file" | sed 's|.*/src/||')
          [ ${#display} -gt 40 ] && display="...${display: -37}"
          int_pct=${pct%.*}
          if [ "$int_pct" -ge 80 ]; then color=$GREEN
          elif [ "$int_pct" -ge 60 ]; then color=$YELLOW
          else color=$RED; fi
          printf "  %-42s %b%6.1f%%%b %b(%d/%d)%b\n" "$display" "$color" "$pct" "$NC" "$DIM" "$covered" "$total" "$NC"
        done
        echo -e "${DIM}────────────────────────────────────────────────────────${NC}"
        echo ""
      fi

      # Summary
      echo -e "${BOLD}${CYAN}Coverage Summary${NC}"
      echo -e "${DIM}────────────────────────────────────────${NC}"
      echo -e "  ${BOLD}Lines:${NC}     $(color_pct $LINES_PCT)  ${DIM}(${LINES_COV}/${LINES_TOT})${NC}"
      echo -e "  ${BOLD}Functions:${NC} $(color_pct $FUNCS_PCT)  ${DIM}(${FUNCS_COV}/${FUNCS_TOT})${NC}"
      echo -e "  ${BOLD}Regions:${NC}   $(color_pct $REGIONS_PCT)"
      echo -e "${DIM}────────────────────────────────────────${NC}"
      echo ""

      # Threshold check
      THRESHOLD_FAILED=0
      if [ "${fail_under}" != "0" ]; then
        LINES_INT=${LINES_PCT%.*}
        THRESHOLD_INT=${fail_under%.*}
        if [ "$LINES_INT" -lt "$THRESHOLD_INT" ]; then
          THRESHOLD_FAILED=1
          echo -e "${RED}${BOLD}✗ Coverage ${LINES_PCT}% is below ${fail_under}% threshold${NC}"
        else
          echo -e "${GREEN}${BOLD}✓ Coverage ${LINES_PCT}% meets ${fail_under}% threshold${NC}"
        fi
        echo ""
      fi

      echo -e "${BLUE}Report:${NC} target/llvm-cov/html/index.html"

      [ "$TEST_FAILED" = "1" ] || [ "$THRESHOLD_FAILED" = "1" ] && exit 1 || true

  # Full CI pipeline
  # Mutation testing: the mechanical form of "revert the fix, confirm the test
  # goes red". Deliberately NOT in `ci`'s `before:` - it reruns the whole suite
  # once per mutant, so it belongs on a schedule and before a release, not on
  # every push. `bin/mutants-gate` explains the ratchet.
  mutants:
    help: "Find tests that pass for the wrong reason (gate against mutants-baseline.txt)"
    params:
      --write:
        default: "false"
        help: "Regenerate mutants-baseline.txt from this run instead of gating"
      --file:
        default: ""
        help: "Restrict to one source file, e.g. src/executor/scheduler.rs"
    bash: |
      args=()
      [ "$write" = "true" ] && args+=(--write)
      [ -n "$file" ] && args+=(--file "$file")
      bin/mutants-gate "${args[@]}"

  ci:
    help: "Full CI pipeline (lint + check + test + coverage gate)"
    # `cov`'s own `after: [cov-report]` chains the gate: cov instruments and
    # runs the suite, then cov-report reads its output and fails the run if
    # line coverage is under `--fail-under`'s default (see cov-report above).
    before: [lint, check, test, cov]
    bash: |
      echo "✅ All CI checks passed!"

  # Build documentation
  docs:
    help: "Build documentation"
    bash: |
      cargo doc --no-deps --workspace
      echo "✅ Documentation built"

  # Validate example ottofiles
  examples:
    help: "Validate all example ottofiles parse correctly"
    bash: |
      echo "Validating example ottofiles..."
      failed=0
      for dir in examples/*/; do
        if [ -f "$dir/otto.yml" ] || [ -f "$dir/otto.yaml" ] || [ -f "$dir/.otto.yml" ]; then
          echo -n "Checking $(basename $dir)... "
          if cargo run --quiet --manifest-path=./Cargo.toml -- -o "$dir" --help > /dev/null 2>&1; then
            echo "✅"
          else
            echo "❌"
            failed=$((failed + 1))
          fi
        fi
      done
      if [ $failed -eq 0 ]; then
        echo ""
        echo "✅ All examples valid!"
      else
        echo ""
        echo "❌ $failed example(s) failed validation"
        exit 1
      fi

  # Quick validation
  quick:
    help: "Quick validation (check + test in parallel)"
    before: [check, test]
    bash: |
      echo "✅ Quick checks passed!"

  # Run everything
  all:
    help: "Run everything (ci + docs + examples in parallel)"
    before: [ci, docs, examples]
    bash: |
      echo ""
      echo "=== Summary ==="
      echo "✅ All tests passed"
      echo "✅ Clippy checks passed"
      echo "✅ Format checks passed"
      echo "✅ Documentation built"
      echo "✅ Examples validated"
      echo ""
      echo "🎉 Everything looks great!"

  # Build release binaries
  build:
    help: "Build release binaries for all workspace members"
    bash: |
      cargo build --release --workspace
      echo "✅ Release build complete for all workspace members"

  # Clean build artifacts
  clean:
    help: "Deep clean (cargo clean + remove all otto run artifacts)"
    bash: |
      echo "Cleaning cargo artifacts..."
      cargo clean
      echo ""
      echo "✅ All cleaned!"

  # Install binary locally
  install:
    help: "Install otto binary locally via cargo"
    bash: |
      cargo install --path .
      echo "✅ otto installed to ~/.cargo/bin"
