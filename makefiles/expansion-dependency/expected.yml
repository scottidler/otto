# Expected conversion of this directory's Makefile: no rule here keeps a
# prerequisite edge, because none of them names a task this file defines.
# `link`'s and `deps.d`'s are make expansions; `package`'s `headers` is a plain
# name with no rule in this Makefile. Every one is warned about and left out,
# because otto refuses a dangling edge at the level of the whole file: one of
# them would stop `link` running too.
otto:
  about: Converted from Makefile
  api: '1'
  tasks:
  - link
  envs:
    OBJS: a.o b.o
tasks:
  link:
    bash: echo linking
  package:
    bash: echo packaging
  deps.d:
    bash: echo depend
